<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <style>
      .wallet-bg { fill: #10b981; }
      .wallet-stroke { stroke: #065f46; stroke-width: 1.5; fill: none; }
      .coin { fill: #fbbf24; stroke: #d97706; stroke-width: 1; }
    </style>
  </defs>
  
  <!-- Wallet body -->
  <rect class="wallet-bg" x="3" y="6" width="18" height="14" rx="2" ry="2"/>
  <rect class="wallet-stroke" x="3" y="6" width="18" height="14" rx="2" ry="2"/>
  
  <!-- Wallet flap -->
  <path class="wallet-bg" d="M3 8 L3 6 C3 4.9 3.9 4 5 4 L19 4 C20.1 4 21 4.9 21 6 L21 8" />
  <path class="wallet-stroke" d="M3 8 L3 6 C3 4.9 3.9 4 5 4 L19 4 C20.1 4 21 4.9 21 6 L21 8" />
  
  <!-- Card slot -->
  <line class="wallet-stroke" x1="6" y1="10" x2="11" y2="10"/>
  
  <!-- Money pocket indicator -->
  <circle class="coin" cx="15" cy="14" r="2.5"/>
  <text x="15" y="15.5" text-anchor="middle" font-size="3" font-weight="bold" fill="#065f46">$</text>
</svg>
